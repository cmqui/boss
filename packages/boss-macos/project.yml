name: Boss
options:
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
  DebugStatic: debug
  ReleaseStatic: release
packages:
  bossAppleApp:
    path: ../boss-apple-app
  libbossApple:
    path: ../libboss-apple
settings:
  base:
    SWIFT_VERSION: 6.0
    PRODUCT_NAME: Boss
    PRODUCT_BUNDLE_IDENTIFIER: com.cmqui.boss.macos
    MACOSX_DEPLOYMENT_TARGET: 14.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Boss
    INFOPLIST_KEY_CFBundleName: Boss
    INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Boss uses Bluetooth to discover and connect to your Bose headphones so it can read and change device settings.
    INFOPLIST_KEY_NSHighResolutionCapable: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Boss:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        BOSS_RUST_FFI_LINKAGE: dynamic
        BOSS_RUST_FFI_PROFILE: debug
      configs:
        Release:
          BOSS_RUST_FFI_PROFILE: release
        DebugStatic:
          BOSS_RUST_FFI_LINKAGE: static
          OTHER_LDFLAGS: $(inherited) -Wl,-export_dynamic -Wl,-force_load,$(SRCROOT)/../libboss/target/$(BOSS_RUST_FFI_PROFILE)/libboss_ffi.a
        ReleaseStatic:
          BOSS_RUST_FFI_PROFILE: release
          BOSS_RUST_FFI_LINKAGE: static
          OTHER_LDFLAGS: $(inherited) -Wl,-export_dynamic -Wl,-force_load,$(SRCROOT)/../libboss/target/$(BOSS_RUST_FFI_PROFILE)/libboss_ffi.a
    sources:
      - path: Sources/BossMacOS
        excludes:
          - Resources/**
      - path: Sources/BossMacOS/Resources
        buildPhase: resources
      - path: BossXcode/AppIcon.icon
        buildPhase: resources
      - path: BossXcode/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: bossAppleApp
        product: bossAppleApp
      - package: libbossApple
        product: libbossApple
    preBuildScripts:
      - name: Build libboss FFI
        script: |
          /bin/bash "${SRCROOT}/scripts/build-libboss-ffi.sh" build
        outputFiles:
          - $(SRCROOT)/../libboss/target/$(BOSS_RUST_FFI_PROFILE)/libboss_ffi.a
          - $(SRCROOT)/../libboss/target/$(BOSS_RUST_FFI_PROFILE)/libboss_ffi.dylib
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Install libboss FFI dylib
        script: |
          /bin/bash "${SRCROOT}/scripts/build-libboss-ffi.sh" install
        basedOnDependencyAnalysis: false
schemes:
  Boss:
    build:
      targets:
        Boss: all
  Boss Static:
    build:
      targets:
        Boss: all
    run:
      config: DebugStatic
    test:
      config: DebugStatic
    analyze:
      config: DebugStatic
    archive:
      config: ReleaseStatic
    profile:
      config: ReleaseStatic
